name: Check game

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check game JavaScript syntax
        run: node --check game.js
      - name: Run gameplay smoke test
        run: node smoke-test.cjs

