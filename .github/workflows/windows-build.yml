name: Build Windows portable game

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot and Windows export templates
        shell: pwsh
        run: |
          $version = '4.7.2'
          $tempRoot = Join-Path $env:RUNNER_TEMP 'godot'
          $engineZip = Join-Path $tempRoot 'godot.zip'
          $templateBinary = Join-Path $tempRoot 'windows_release_x86_64.exe'
          $engineExtract = Join-Path $tempRoot 'engine'
          New-Item -ItemType Directory -Force -Path $tempRoot, $engineExtract | Out-Null
          curl.exe --fail --location --retry 4 --output $engineZip "https://downloads.godotengine.org/?flavor=stable&platform=windows.64&slug=win64.exe.zip&version=$version"
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the official Godot Windows editor.' }
          Expand-Archive -LiteralPath $engineZip -DestinationPath $engineExtract -Force
          $engine = Get-ChildItem -Path $engineExtract -Filter 'Godot_v4.7.2-stable_win64.exe' -Recurse | Select-Object -First 1
          if (-not $engine) { throw 'Godot executable was missing from the official archive.' }
          python scripts/fetch_godot_template.py --version $version --output $templateBinary
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the official Windows x64 export template.' }
          $templateDestination = Join-Path $env:APPDATA 'Godot\export_templates\4.7.2.stable'
          New-Item -ItemType Directory -Force -Path $templateDestination | Out-Null
          Copy-Item -LiteralPath $templateBinary -Destination (Join-Path $templateDestination 'windows_release_x86_64.exe') -Force
          if (-not (Test-Path (Join-Path $templateDestination 'windows_release_x86_64.exe'))) { throw 'Windows x64 release template was not installed.' }
          "GODOT_EXE=$($engine.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Import project and run 3D campaign checks
        shell: pwsh
        run: |
          & $env:GODOT_EXE --headless --path . --quit-after 3
          if ($LASTEXITCODE -ne 0) { throw 'Godot could not import and start the desktop project.' }
          & $env:GODOT_EXE --headless --path . --script res://tests/smoke_test.gd
          if ($LASTEXITCODE -ne 0) { throw '3D campaign smoke checks failed.' }
          $gameCode = Get-Content 'scripts/game.gd' -Raw
          if ($gameCode -match 'HTTPRequest|HTTPClient|WebSocketPeer|TCPServer|StreamPeerTCP') { throw 'Game code must not require network access.' }

      - name: Export Windows x64 and inspect dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          & $env:GODOT_EXE --headless --path . --export-release 'Windows Desktop' build/LumenDrift.exe
          if ($LASTEXITCODE -ne 0) { throw 'Godot Windows x64 export failed.' }
          if (-not (Test-Path -LiteralPath 'build/LumenDrift.exe')) { throw 'Export did not produce LumenDrift.exe.' }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path 'build/LumenDrift.exe'))
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $signature = [BitConverter]::ToUInt32($bytes, $peOffset)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($signature -ne 0x00004550 -or $machine -ne 0x8664) { throw 'Exported executable is not a Windows x64 PE file.' }
          $info = Get-Item 'build/LumenDrift.exe'
          $sha = (Get-FileHash 'build/LumenDrift.exe' -Algorithm SHA256).Hash
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere is required to locate the PE dependency inspector.' }
          $vsPath = & $vswhere -latest -products '*' -property installationPath
          $msvcRoot = Join-Path $vsPath 'VC\Tools\MSVC'
          $msvcVersion = Get-ChildItem -LiteralPath $msvcRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $dumpbinPath = Join-Path $msvcVersion.FullName 'bin\Hostx64\x64\dumpbin.exe'
          if (-not (Test-Path $dumpbinPath)) { throw 'dumpbin is required to inspect Windows runtime dependencies.' }
          $deps = & $dumpbinPath /dependents (Resolve-Path 'build/LumenDrift.exe') 2>&1
          $deps | Out-File -FilePath 'build/dependencies.txt' -Encoding utf8
          $dllNames = @($deps | ForEach-Object { if ([string]$_ -match '^\s+([A-Za-z0-9_.-]+\.dll)\s*$') { $Matches[1] } } | Sort-Object -Unique)
          if ($dllNames.Count -eq 0) { throw 'No imported DLL dependencies were read from the executable.' }
          $missing = @($dllNames | Where-Object { $_ -notmatch '^(api-ms-win|ext-ms-win)-' -and -not (Test-Path (Join-Path $env:WINDIR ('System32\' + $_))) })
          if ($missing.Count -gt 0) { throw ('Unresolved DLL dependencies: ' + ($missing -join ', ')) }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Windows x64 PE verified: LumenDrift.exe ($([math]::Round($info.Length / 1MB, 2)) MiB), SHA-256 $sha"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Resolved imported DLLs: $($dllNames -join ', ')"

      - name: Launch exported game on Windows
        shell: pwsh
        run: |
          $game = Start-Process -FilePath (Resolve-Path 'build/LumenDrift.exe') -WorkingDirectory (Resolve-Path 'build') -PassThru
          Start-Sleep -Seconds 8
          $game.Refresh()
          if ($game.HasExited) { throw "Game process exited during startup (code $($game.ExitCode))." }
          Stop-Process -Id $game.Id -Force
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Windows runner launch: process remained open for 8 seconds.'

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'LumenDrift-portable'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item 'build/LumenDrift.exe' $package
          @'
          LUMEN DRIFT — WINDOWS x64

          Распакуйте архив и запустите LumenDrift.exe. Godot, браузер, Python и Node.js не нужны.
          Управление: WASD/стрелки — полёт; Space — рывок; F — действие; Esc — пауза; M — звук.
          Windows 10/11 x64, видеодрайвер OpenGL 3.3.
          Прогресс хранится в профиле пользователя Windows.
          '@ | Set-Content -Path (Join-Path $package 'README.txt') -Encoding utf8
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath 'dist/LumenDrift-Windows-x64.zip' -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path 'dist/LumenDrift-Windows-x64.zip'))
          try {
            if (-not ($archive.Entries | Where-Object { $_.FullName -eq 'LumenDrift.exe' })) { throw 'Portable ZIP is missing LumenDrift.exe.' }
            if (-not ($archive.Entries | Where-Object { $_.FullName -eq 'README.txt' })) { throw 'Portable ZIP is missing README.txt.' }
          } finally { $archive.Dispose() }
          $zipInfo = Get-Item 'dist/LumenDrift-Windows-x64.zip'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Portable archive contains LumenDrift.exe and README.txt ($([math]::Round($zipInfo.Length / 1MB, 2)) MiB)."

      - name: Launch game extracted from portable ZIP
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $extract = Join-Path $env:RUNNER_TEMP 'LumenDrift-from-zip'
          [System.IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path 'dist/LumenDrift-Windows-x64.zip'), $extract, $true)
          $game = Start-Process -FilePath (Join-Path $extract 'LumenDrift.exe') -WorkingDirectory $extract -PassThru
          Start-Sleep -Seconds 8
          $game.Refresh()
          if ($game.HasExited) { throw "Extracted game exited during startup (code $($game.ExitCode))." }
          $window = Get-Process -Id $game.Id
          if ($window.MainWindowHandle -eq 0) { throw 'The extracted game process has no visible main window.' }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Portable ZIP extracted and its visible window stayed open for 8 seconds (PID $($game.Id))."
          Stop-Process -Id $game.Id -Force

      - name: Upload portable game and website artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LumenDrift-Windows-x64
          path: |
            dist/LumenDrift-Windows-x64.zip
            website/
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Lumen Drift ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/LumenDrift-Windows-x64.zip
