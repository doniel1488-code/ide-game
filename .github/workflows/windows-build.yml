name: Build Windows portable game

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot and Windows export templates
        shell: pwsh
        run: |
          $version = '4.7.2'
          $tempRoot = Join-Path $env:RUNNER_TEMP 'godot'
          $engineZip = Join-Path $tempRoot 'godot.zip'
          $templateBinary = Join-Path $tempRoot 'windows_release_x86_64.exe'
          $engineExtract = Join-Path $tempRoot 'engine'
          New-Item -ItemType Directory -Force -Path $tempRoot, $engineExtract | Out-Null
          curl.exe --fail --location --retry 8 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 900 --output $engineZip "https://downloads.godotengine.org/?flavor=stable&platform=windows.64&slug=win64.exe.zip&version=$version"
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the official Godot Windows editor.' }
          if ((Get-Item -LiteralPath $engineZip).Length -lt 30000000) { throw 'Downloaded Godot editor archive is unexpectedly small.' }
          Expand-Archive -LiteralPath $engineZip -DestinationPath $engineExtract -Force
          $engine = Get-ChildItem -Path $engineExtract -Filter 'Godot_v4.7.2-stable_win64.exe' -Recurse | Select-Object -First 1
          if (-not $engine) { throw 'Godot executable was missing from the official archive.' }
          python scripts/fetch_godot_template.py --version $version --output $templateBinary
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the official Windows x64 export template.' }
          $templateDestination = Join-Path $env:APPDATA 'Godot\export_templates\4.7.2.stable'
          New-Item -ItemType Directory -Force -Path $templateDestination | Out-Null
          Copy-Item -LiteralPath $templateBinary -Destination (Join-Path $templateDestination 'windows_release_x86_64.exe') -Force
          if (-not (Test-Path (Join-Path $templateDestination 'windows_release_x86_64.exe'))) { throw 'Windows x64 release template was not installed.' }
          "GODOT_EXE=$($engine.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Record Godot version
        id: godot_version
        continue-on-error: true
        shell: pwsh
        run: |
          & ./scripts/ci/run_godot.ps1 -Name version -GodotArguments @('--version')

      - name: Import Godot project in headless editor
        id: godot_import
        continue-on-error: true
        shell: pwsh
        run: |
          & ./scripts/ci/run_godot.ps1 -Name import -GodotArguments @('--headless', '--editor', '--path', '.', '--quit', '--verbose')

      - name: Start main scene headlessly
        id: godot_scene
        continue-on-error: true
        shell: pwsh
        run: |
          & ./scripts/ci/run_godot.ps1 -Name scene -GodotArguments @('--headless', '--path', '.', '--quit-after', '3', '--verbose')

      - name: Run campaign smoke test
        id: godot_smoke
        continue-on-error: true
        shell: pwsh
        run: |
          & ./scripts/ci/run_godot.ps1 -Name smoke -GodotArguments @('--headless', '--path', '.', '--script', 'res://tests/smoke_test.gd', '--verbose')
          $gameCode = Get-Content 'scripts/game.gd' -Raw
          if ($gameCode -match 'HTTPRequest|HTTPClient|WebSocketPeer|TCPServer|StreamPeerTCP') { throw 'Game code must not require network access.' }

      - name: Gate export on all Godot diagnostics
        if: always()
        shell: pwsh
        run: |
          $failed = @()
          if ('${{ steps.godot_version.outcome }}' -ne 'success') { $failed += 'version' }
          if ('${{ steps.godot_import.outcome }}' -ne 'success') { $failed += 'editor import' }
          if ('${{ steps.godot_scene.outcome }}' -ne 'success') { $failed += 'main scene startup' }
          if ('${{ steps.godot_smoke.outcome }}' -ne 'success') { $failed += 'campaign smoke test/network audit' }
          if ($failed.Count -gt 0) { throw "Godot diagnostics failed: $($failed -join ', '). See printed logs and godot-diagnostics artifact." }

      - name: Upload Godot diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Godot-diagnostics
          path: ${{ runner.temp }}/godot-diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Export Windows x64
        id: windows_export
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Remove-Item -LiteralPath 'build/LumenDrift.exe' -Force -ErrorAction SilentlyContinue
          & ./scripts/ci/run_godot.ps1 -Name export -GodotArguments @('--headless', '--path', '.', '--export-release', 'Windows Desktop', 'build/LumenDrift.exe', '--verbose')

      - name: Inspect Windows export and template
        id: inspect_export
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $template = Join-Path $env:APPDATA 'Godot\export_templates\4.7.2.stable\windows_release_x86_64.exe'
          if (-not (Test-Path -LiteralPath $template)) { throw "Expected Windows release template missing: $template" }
          $templateInfo = Get-Item -LiteralPath $template
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Export template present: $($templateInfo.Length) bytes at $template"
          $exePath = 'build/LumenDrift.exe'
          if (-not (Test-Path -LiteralPath $exePath)) { throw 'Godot returned without producing build/LumenDrift.exe.' }
          $info = Get-Item -LiteralPath $exePath
          if ($info.Length -lt 4096) { throw "Exported EXE is unexpectedly small ($($info.Length) bytes)." }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exePath))
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($peOffset -lt 0x40 -or $peOffset + 6 -gt $bytes.Length) { throw "Invalid PE header offset $peOffset in exported EXE." }
          $signature = [BitConverter]::ToUInt32($bytes, $peOffset)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($signature -ne 0x00004550 -or $machine -ne 0x8664) { throw 'Exported executable is not a valid Windows x64 PE file.' }
          $sha = (Get-FileHash $exePath -Algorithm SHA256).Hash
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Windows x64 PE verified: LumenDrift.exe ($([math]::Round($info.Length / 1MB, 2)) MiB), SHA-256 $sha"

      - name: Gate Windows export
        if: always()
        shell: pwsh
        run: |
          $failed = @()
          if ('${{ steps.windows_export.outcome }}' -ne 'success') { $failed += 'Godot export exit code/log' }
          if ('${{ steps.inspect_export.outcome }}' -ne 'success') { $failed += 'EXE/template/PE inspection' }
          if ($failed.Count -gt 0) { throw "Windows export verification failed: $($failed -join ', '). See export diagnostics artifact." }

      - name: Upload export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-export-diagnostics
          path: ${{ runner.temp }}/godot-diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Inspect Windows runtime dependencies
        shell: pwsh
        run: |
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere is required to locate the PE dependency inspector.' }
          $vsPath = & $vswhere -latest -products '*' -property installationPath
          $msvcRoot = Join-Path $vsPath 'VC\Tools\MSVC'
          $msvcVersion = Get-ChildItem -LiteralPath $msvcRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $dumpbinPath = Join-Path $msvcVersion.FullName 'bin\Hostx64\x64\dumpbin.exe'
          if (-not (Test-Path $dumpbinPath)) { throw 'dumpbin is required to inspect Windows runtime dependencies.' }
          $deps = & $dumpbinPath /dependents (Resolve-Path 'build/LumenDrift.exe') 2>&1
          $deps | Out-File -FilePath 'build/dependencies.txt' -Encoding utf8
          $dllNames = @($deps | ForEach-Object { if ([string]$_ -match '^\s+([A-Za-z0-9_.-]+\.dll)\s*$') { $Matches[1] } } | Sort-Object -Unique)
          if ($dllNames.Count -eq 0) { throw 'No imported DLL dependencies were read from the executable.' }
          $missing = @($dllNames | Where-Object { $_ -notmatch '^(api-ms-win|ext-ms-win)-' -and -not (Test-Path (Join-Path $env:WINDIR ('System32\' + $_))) })
          if ($missing.Count -gt 0) { throw ('Unresolved DLL dependencies: ' + ($missing -join ', ')) }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Resolved imported DLLs: $($dllNames -join ', ')"

      - name: Launch exported game on Windows
        shell: pwsh
        run: |
          $game = Start-Process -FilePath (Resolve-Path 'build/LumenDrift.exe') -WorkingDirectory (Resolve-Path 'build') -PassThru
          Start-Sleep -Seconds 8
          $game.Refresh()
          if ($game.HasExited) { throw "Game process exited during startup (code $($game.ExitCode))." }
          Stop-Process -Id $game.Id -Force
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Windows runner launch: process remained open for 8 seconds.'

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'LumenDrift-portable'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item 'build/LumenDrift.exe' $package
          @'
          LUMEN DRIFT — WINDOWS x64

          Распакуйте архив и запустите LumenDrift.exe. Godot, браузер, Python и Node.js не нужны.
          Управление: WASD/стрелки — полёт; Space — рывок; F — действие; Esc — пауза; M — звук.
          Windows 10/11 x64, видеодрайвер OpenGL 3.3.
          Прогресс хранится в профиле пользователя Windows.
          '@ | Set-Content -Path (Join-Path $package 'README.txt') -Encoding utf8
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath 'dist/LumenDrift-Windows-x64.zip' -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path 'dist/LumenDrift-Windows-x64.zip'))
          try {
            if (-not ($archive.Entries | Where-Object { $_.FullName -eq 'LumenDrift.exe' })) { throw 'Portable ZIP is missing LumenDrift.exe.' }
            if (-not ($archive.Entries | Where-Object { $_.FullName -eq 'README.txt' })) { throw 'Portable ZIP is missing README.txt.' }
          } finally { $archive.Dispose() }
          $zipInfo = Get-Item 'dist/LumenDrift-Windows-x64.zip'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Portable archive contains LumenDrift.exe and README.txt ($([math]::Round($zipInfo.Length / 1MB, 2)) MiB)."

      - name: Capture screenshots from the actual Windows game
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build/LumenDrift.exe').Path
          $previewDir = (Resolve-Path 'dist').Path
          $captures = @(
            @{ Path = (Join-Path $previewDir 'LumenDrift-gameplay.png'); Mode = 'gameplay' },
            @{ Path = (Join-Path $previewDir 'LumenDrift-menu.png'); Menu = $true; Mode = 'menu' },
            @{ Path = (Join-Path $previewDir 'LumenDrift-chapter-one.png'); Mode = 'overview' },
            @{ Path = (Join-Path $previewDir 'LumenDrift-kepler.png'); Mode = 'ship' },
            @{ Path = (Join-Path $previewDir 'LumenDrift-relay.png'); Mode = 'relay' },
            @{ Path = (Join-Path $previewDir 'LumenDrift-flight.png'); Mode = 'flight' },
            @{ Path = (Join-Path $previewDir 'LumenDrift-asteroids.png'); Mode = 'asteroids' }
          )
          foreach ($capture in $captures) {
            Remove-Item -LiteralPath $capture.Path -Force -ErrorAction SilentlyContinue
            $arguments = @('--', ('"--capture-preview={0}"' -f $capture.Path), "--capture-mode=$($capture.Mode)")
            if ($capture.Menu) { $arguments += '--capture-menu' }
            $process = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
            if (-not $process.WaitForExit(45000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "Timed out capturing $($capture.Mode)."
            }
            if ($process.ExitCode -ne 0) { throw "Capture $($capture.Mode) exited with code $($process.ExitCode)." }
            if (-not (Test-Path -LiteralPath $capture.Path)) { throw "Game did not save preview screenshot: $($capture.Path)" }
            $image = Get-Item -LiteralPath $capture.Path
            if ($image.Length -lt 10000) { throw "Captured preview is unexpectedly small: $($image.Length) bytes." }
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Captured actual game screenshot $($image.Name) ($([math]::Round($image.Length / 1KB)) KiB)."
          }

      - name: Launch game extracted from portable ZIP
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $extract = Join-Path $env:RUNNER_TEMP 'LumenDrift-from-zip'
          [System.IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path 'dist/LumenDrift-Windows-x64.zip'), $extract, $true)
          $exe = Join-Path $extract 'LumenDrift.exe'
          $ruleName = "LumenDrift-offline-$PID"
          New-NetFirewallRule -DisplayName $ruleName -Direction Outbound -Program $exe -Action Block -Profile Any | Out-Null
          try {
            $game = Start-Process -FilePath $exe -WorkingDirectory $extract -PassThru
            Start-Sleep -Seconds 8
            $game.Refresh()
            if ($game.HasExited) { throw "Extracted game exited during startup (code $($game.ExitCode))." }
            $window = Get-Process -Id $game.Id
            if ($window.MainWindowHandle -eq 0) { throw 'The extracted game process has no visible main window.' }
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Portable ZIP opened a visible game window for 8 seconds with outbound network blocked (PID $($game.Id))."
            Stop-Process -Id $game.Id -Force
          } finally {
            if ($game -and -not $game.HasExited) { Stop-Process -Id $game.Id -Force }
            Remove-NetFirewallRule -DisplayName $ruleName -ErrorAction SilentlyContinue
          }

      - name: Upload portable game and website artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LumenDrift-Windows-x64
          path: |
            dist/LumenDrift-Windows-x64.zip
            dist/LumenDrift-gameplay.png
            dist/LumenDrift-menu.png
            dist/LumenDrift-chapter-one.png
            dist/LumenDrift-kepler.png
            dist/LumenDrift-relay.png
            dist/LumenDrift-flight.png
            dist/LumenDrift-asteroids.png
            website/
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Lumen Drift ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/LumenDrift-Windows-x64.zip
            dist/LumenDrift-gameplay.png
            dist/LumenDrift-menu.png
